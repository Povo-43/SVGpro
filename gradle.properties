# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Release APK 署名（共通固定鍵：絶対に再生成・変更しない）。
# 実機へのアップデートインストール時に署名が一致しないと
# "INSTALL_FAILED_UPDATE_INCOMPATIBLE" でインストールできなくなるため、
# このキーストアとエイリアスを全ビルド・CIで共通に固定する。
#
# キーストア本体は app/svgpro-release.keystore に配置し、.gitignore で除外。
# パスワードは環境変数 RELEASE_STORE_PASSWORD / RELEASE_KEY_PASSWORD から読み込みます。
# CI は GitHub Secrets から復元して渡します（絶対にリポジトリに平文でコミットしないでください）。
android.signing.release.storeFile=app/svgpro-release.keystore
android.signing.release.keyAlias=svgpro-release
