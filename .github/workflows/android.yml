name: Android CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v1.2.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # リリース鍵（キーストア）を GitHub Secrets から復元。PR ではスキップ。
      - name: Restore release keystore from GitHub Secret
        if: github.event_name != 'pull_request' && secrets.RELEASE_KEYSTORE_B64 != ''
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 -d > app/svgpro-release.keystore

      - name: Run core tests
        run: ./gradlew :core:test --console=plain

      - name: Run editor unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --console=plain
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SVGpro-debug
          path: app/build/outputs/apk/debug/SVGpro-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: SVGpro-release
          path: app/build/outputs/apk/release/SVGpro-release.apk

      - name: Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: SVGpro ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            app/build/outputs/apk/debug/SVGpro-debug.apk
            app/build/outputs/apk/release/SVGpro-release.apk
          generate_release_notes: true
